<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Line Compare</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='7' y='7' width='18' height='18' transform='rotate(45 16 16)' fill='%233f6fa8' stroke='%23e7eaf0' stroke-width='1.5'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0f14; --panel:#14171f; --panel-edge:#232732;
  --blue:#3f6fa8; --blue2:#5c7f9e; --steel:#7c8698;
  --ink:#e7eaf0; --ink-soft:#727c8c; --line:#252a35;
  --font-ui:'Space Grotesk', system-ui, sans-serif;
  --font-display:'Playfair Display', serif;
  --add-bg: rgba(92,159,127,.12); --add-line:#5c9f7f;
  --rem-bg: rgba(168,92,92,.12); --rem-line:#a85c5c;
  --chg-bg: rgba(92,127,158,.14);
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top,0px);
  padding-bottom: env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
body{
  margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  font-family:var(--font-ui);
}

header{
  padding:22px 30px;
  border-bottom:4px double var(--blue2);
  display:flex; align-items:baseline; gap:16px; flex-wrap:wrap;
}
header h1{
  margin:0; font-family:'Playfair Display', serif; font-weight:800;
  font-size:1.5rem; letter-spacing:.02em; color:var(--ink);
}
header span{
  color:var(--ink-soft); font-size:.72rem; text-transform:uppercase;
  letter-spacing:.24em;
}

.wrap{ max-width:1180px; margin:0 auto; padding:28px 20px 60px; }

.group-title{
  display:flex; align-items:center; gap:10px;
  text-transform:uppercase; letter-spacing:.26em; font-size:.66rem;
  color:var(--ink-soft); margin-bottom:12px;
}
.group-title::before{
  content:''; width:6px; height:6px; background:var(--blue);
  transform:rotate(45deg); flex:none;
}
.group-title::after{
  content:''; flex:1; height:3px;
  border-top:1px solid var(--blue); border-bottom:1px solid var(--blue2);
}

.cols{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
@media (max-width:800px){ .cols{ grid-template-columns:1fr; } }

.rail-frame{ position:relative; padding:22px 18px 18px; margin-bottom:20px; }
.rail-frame::before, .rail-frame::after{ content:''; position:absolute; pointer-events:none; }
.rail-frame::before{ inset:8px;  border:1px solid rgba(231,234,240,.6); }
.rail-frame::after{  inset:13px; border:1px solid rgba(92,127,158,.35); }
.rail-d{
  position:absolute; width:10px; height:10px;
  background:var(--blue); border:2px solid var(--bg);
  transform:translate(-50%,-50%) rotate(45deg);
  box-shadow:0 0 0 1px rgba(231,234,240,.5); z-index:2;
}
.rail-d.tl{ top:8px; left:8px; } .rail-d.tr{ top:8px; left:calc(100% - 8px); }
.rail-d.bl{ top:calc(100% - 8px); left:8px; } .rail-d.br{ top:calc(100% - 8px); left:calc(100% - 8px); }

textarea{
  width:100%; min-height:260px; resize:vertical; background:var(--panel);
  border:1px solid var(--line); color:var(--ink); font-family:'IBM Plex Mono', monospace;
  font-size:.82rem; line-height:1.6; padding:14px; outline:none;
}
textarea:focus{ border-color:var(--blue2); }
textarea::placeholder{ color:var(--ink-soft); }

.actions{ display:flex; justify-content:center; margin:6px 0 28px; }
button.tool{
  --c:var(--blue2);
  border:1px solid var(--line);
  background:
    linear-gradient(var(--c),var(--c)) top left/8px 1px no-repeat,
    linear-gradient(var(--c),var(--c)) top left/1px 8px no-repeat,
    linear-gradient(var(--c),var(--c)) top right/8px 1px no-repeat,
    linear-gradient(var(--c),var(--c)) top right/1px 8px no-repeat,
    linear-gradient(var(--c),var(--c)) bottom left/8px 1px no-repeat,
    linear-gradient(var(--c),var(--c)) bottom left/1px 8px no-repeat,
    linear-gradient(var(--c),var(--c)) bottom right/8px 1px no-repeat,
    linear-gradient(var(--c),var(--c)) bottom right/1px 8px no-repeat,
    var(--panel);
  box-shadow:inset 0 0 0 3px var(--panel), inset 0 0 0 4px var(--panel-edge);
  color:var(--ink); font-size:.72rem; letter-spacing:.12em; text-transform:uppercase;
  padding:13px 34px; cursor:pointer;
}
button.tool:hover{ --c:#fff; }

.stats{ display:flex; gap:22px; justify-content:center; margin-bottom:22px; color:var(--ink-soft); font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; }
.stats b{ color:var(--ink); font-family:var(--font-ui); letter-spacing:0; text-transform:none; }
.stats .n-add b{ color:var(--add-line); } .stats .n-rem b{ color:var(--rem-line); }

.diff-list{ font-family:'IBM Plex Mono', monospace; font-size:.82rem; }
.row{ display:grid; grid-template-columns:44px 44px 1fr; gap:0; border-bottom:1px solid var(--line); }
.row .num{ padding:6px 8px; color:var(--ink-soft); text-align:right; font-size:.72rem; }
.row .txt{ padding:6px 10px; white-space:pre-wrap; word-break:break-word; }
.row.add{ background:var(--add-bg); }
.row.add .txt::before{ content:'+ '; color:var(--add-line); }
.row.rem{ background:var(--rem-bg); }
.row.rem .txt::before{ content:'- '; color:var(--rem-line); }
.row.chg-a{ background:var(--chg-bg); }
.row.chg-a .txt::before{ content:'~ '; color:var(--blue2); }
.row.chg-b{ background:var(--chg-bg); border-bottom:1px solid var(--line); }
.row.chg-b .txt::before{ content:'~ '; color:var(--blue2); }
.empty{ color:var(--ink-soft); padding:20px 10px; text-align:center; letter-spacing:.04em; }
</style>
</head>
<body>
<header>
  <h1>Line Compare</h1>
  <span>Line-by-line text diff</span>
</header>

<div class="wrap">
  <div class="cols">
    <div class="rail-frame">
      <div class="rail-d tl"></div><div class="rail-d tr"></div><div class="rail-d bl"></div><div class="rail-d br"></div>
      <div class="group-title">Text A</div>
      <textarea id="taA" placeholder="Paste the first text here…"></textarea>
    </div>
    <div class="rail-frame">
      <div class="rail-d tl"></div><div class="rail-d tr"></div><div class="rail-d bl"></div><div class="rail-d br"></div>
      <div class="group-title">Text B</div>
      <textarea id="taB" placeholder="Paste the second text here…"></textarea>
    </div>
  </div>

  <div class="actions"><button class="tool" id="btnCompare">Compare</button></div>

  <div class="rail-frame">
    <div class="rail-d tl"></div><div class="rail-d tr"></div><div class="rail-d bl"></div><div class="rail-d br"></div>
    <div class="group-title">Differences</div>
    <div class="stats" id="stats" style="display:none;">
      <span class="n-add">added <b id="cAdd">0</b></span>
      <span class="n-rem">removed <b id="cRem">0</b></span>
      <span class="n-chg">changed <b id="cChg">0</b></span>
    </div>
    <div class="diff-list" id="diffList">
      <div class="empty">Enter text on both sides and press Compare.</div>
    </div>
  </div>
</div>

<script>
function splitLines(s){ return s.replace(/\r\n/g,'\n').split('\n'); }

// LCS-based line diff -> sequence of {type:'same'|'add'|'rem', a, b}
function diffLines(a, b){
  const n = a.length, m = b.length;
  const dp = Array.from({length:n+1}, () => new Int32Array(m+1));
  for(let i=n-1;i>=0;i--){
    for(let j=m-1;j>=0;j--){
      dp[i][j] = a[i]===b[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
    }
  }
  const ops = [];
  let i=0, j=0;
  while(i<n && j<m){
    if(a[i]===b[j]){ ops.push({type:'same', a:i, b:j}); i++; j++; }
    else if(dp[i+1][j] >= dp[i][j+1]){ ops.push({type:'rem', a:i}); i++; }
    else { ops.push({type:'add', b:j}); j++; }
  }
  while(i<n){ ops.push({type:'rem', a:i}); i++; }
  while(j<m){ ops.push({type:'add', b:j}); j++; }
  return ops;
}

// Group consecutive rem+add runs into paired "changed" rows where possible
function render(a, b){
  const ops = diffLines(a, b);
  const list = document.getElementById('diffList');
  list.innerHTML = '';
  let addCount=0, remCount=0, chgCount=0;
  let k = 0;
  const frag = document.createDocumentFragment();

  while(k < ops.length){
    const op = ops[k];
    if(op.type === 'same'){ k++; continue; }

    // collect a run of consecutive rem/add
    let rems = [], adds = [];
    while(k < ops.length && ops[k].type !== 'same'){
      if(ops[k].type==='rem') rems.push(ops[k]); else adds.push(ops[k]);
      k++;
    }
    const pairs = Math.min(rems.length, adds.length);
    for(let p=0; p<pairs; p++){
      chgCount++;
      frag.appendChild(rowEl(rems[p].a+1, '', a[rems[p].a], 'chg-a'));
      frag.appendChild(rowEl('', adds[p].b+1, b[adds[p].b], 'chg-b'));
    }
    for(let p=pairs; p<rems.length; p++){ remCount++; frag.appendChild(rowEl(rems[p].a+1, '', a[rems[p].a], 'rem')); }
    for(let p=pairs; p<adds.length; p++){ addCount++; frag.appendChild(rowEl('', adds[p].b+1, b[adds[p].b], 'add')); }
  }

  if(!frag.childNodes.length){
    list.innerHTML = '<div class="empty">No differences found — the texts match line for line.</div>';
  } else {
    list.appendChild(frag);
  }
  document.getElementById('stats').style.display = 'flex';
  document.getElementById('cAdd').textContent = addCount;
  document.getElementById('cRem').textContent = remCount;
  document.getElementById('cChg').textContent = chgCount;
}

function rowEl(numA, numB, text, cls){
  const row = document.createElement('div');
  row.className = 'row ' + cls;
  const na = document.createElement('div'); na.className='num'; na.textContent = numA;
  const nb = document.createElement('div'); nb.className='num'; nb.textContent = numB;
  const tx = document.createElement('div'); tx.className='txt'; tx.textContent = text;
  row.appendChild(na); row.appendChild(nb); row.appendChild(tx);
  return row;
}

document.getElementById('btnCompare').addEventListener('click', () => {
  const a = splitLines(document.getElementById('taA').value);
  const b = splitLines(document.getElementById('taB').value);
  render(a, b);
});
</script>
</body>
</html>
